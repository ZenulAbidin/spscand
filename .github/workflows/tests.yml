name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y libsecp256k1-1
      - run: make -C libspscan check
      - run: python -m unittest discover -s tests -v
      - run: SPSCAND_PURE_PYTHON=1 python -m unittest discover -s tests -v
